# Local development stack. NOT for production use.
# Demo credentials below exist only for local development and are unsafe anywhere else.
name: visionroute

services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: visionroute
      POSTGRES_PASSWORD: visionroute
      POSTGRES_DB: visionroute
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visionroute"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: visionroute
      MINIO_ROOT_PASSWORD: visionroute-dev-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    env_file: .env
    environment:
      VISIONROUTE_DATABASE_URL: postgresql+asyncpg://visionroute:visionroute@postgres:5432/visionroute
      VISIONROUTE_REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    command: ["visionroute", "worker", "run"]
    env_file: .env
    environment:
      VISIONROUTE_DATABASE_URL: postgresql+asyncpg://visionroute:visionroute@postgres:5432/visionroute
      VISIONROUTE_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    profiles: ["full"]

volumes:
  pgdata:
  miniodata:
