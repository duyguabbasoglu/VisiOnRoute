# CI baseline. Third-party actions are pinned by commit SHA (supply-chain rule).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: visionroute
          POSTGRES_PASSWORD: visionroute
          POSTGRES_DB: visionroute
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U visionroute"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Format check
        run: poetry run ruff format --check src tests
      - name: Lint
        run: poetry run ruff check src tests
      - name: Import boundaries
        run: poetry run lint-imports
      - name: Type check
        run: poetry run mypy
      - name: Install Unicode fonts (Turkish PDF reports)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Unit tests
        run: poetry run pytest tests/unit -q
      - name: Integration & security tests
        env:
          VISIONROUTE_DATABASE_URL: postgresql+asyncpg://visionroute:visionroute@localhost:5433/visionroute
          VISIONROUTE_TEST_PDF_FONT_DIR: /usr/share/fonts/truetype/dejavu
        run: poetry run pytest tests/integration tests/security -q
      - name: Start MinIO (S3 contract)
        # Pinned release binary verified against MinIO's published SHA-256.
        env:
          MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
          MINIO_ROOT_USER: visionroute
          MINIO_ROOT_PASSWORD: visionroute-dev-only
        run: |
          base="https://dl.min.io/server/minio/release/linux-amd64/archive"
          curl -fsSLo minio "$base/minio.$MINIO_RELEASE"
          curl -fsSL "$base/minio.$MINIO_RELEASE.sha256sum" | awk '{print $1"  minio"}' | sha256sum -c -
          chmod +x minio
          mkdir -p "$RUNNER_TEMP/minio-data"
          nohup ./minio server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/minio.log"; exit 1
      - name: Contract tests (ingestion envelope, S3 storage against MinIO)
        env:
          VISIONROUTE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        run: poetry run pytest tests/contract -q
      - name: Bandit (SAST)
        run: poetry run bandit -c pyproject.toml -r src -q
      - name: Dependency audit
        run: poetry run pip-audit --skip-editable
        continue-on-error: true  # audit failures reported, triaged via HANDOVER

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
      - name: Validate all environments
        run: |
          for env_dir in infra/terraform/envs/*/; do
            echo "== $env_dir"
            terraform -chdir="$env_dir" init -backend=false -input=false
            terraform -chdir="$env_dir" validate
          done
