# CI baseline. Third-party actions are pinned by commit SHA (supply-chain rule).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  POETRY_VIRTUALENVS_IN_PROJECT: "true"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: visionroute
          POSTGRES_PASSWORD: visionroute
          POSTGRES_DB: visionroute
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U visionroute"
          --health-interval 5s --health-timeout 3s --health-retries 10
      # The rate-limit integration test asserts that two limiter instances share
      # counters through a real Redis; without this service it would fail open.
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Format check
        run: poetry run ruff format --check src tests
      - name: Lint
        run: poetry run ruff check src tests
      - name: Import boundaries
        run: poetry run lint-imports
      - name: Type check
        run: poetry run mypy
      - name: Install Unicode fonts (Turkish PDF reports)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
      - name: Unit tests
        run: poetry run pytest tests/unit -q
      - name: Integration & security tests
        env:
          VISIONROUTE_DATABASE_URL: postgresql+asyncpg://visionroute:visionroute@localhost:5433/visionroute
          VISIONROUTE_TEST_PDF_FONT_DIR: /usr/share/fonts/truetype/dejavu
        run: poetry run pytest tests/integration tests/security -q
      - name: Start MinIO (S3 contract)
        # MinIO archived its open-source downloads (dl.min.io answers 410 Gone),
        # so CI runs the same pinned image docker-compose uses for local work.
        env:
          MINIO_IMAGE: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=visionroute \
            -e MINIO_ROOT_PASSWORD=visionroute-dev-only \
            "$MINIO_IMAGE" server /data
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs minio; exit 1
      - name: Contract tests (ingestion envelope, S3 storage against MinIO)
        env:
          VISIONROUTE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
        run: poetry run pytest tests/contract -q
      - name: Bandit (SAST)
        run: poetry run bandit -c pyproject.toml -r src -q
      - name: Dependency audit (blocking)
        run: |
          # The venv's own pip is audited too; keep it at a patched release.
          poetry run python -m pip install --upgrade "pip>=26.2"
          poetry run pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
      - name: Validate all environments
        run: |
          for env_dir in infra/terraform/envs/*/; do
            echo "== $env_dir"
            terraform -chdir="$env_dir" init -backend=false -input=false
            terraform -chdir="$env_dir" validate
          done

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: visionroute
          POSTGRES_PASSWORD: visionroute
          POSTGRES_DB: visionroute
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U visionroute"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install backend dependencies
        run: poetry install --no-interaction
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: 9
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install web dependencies and Chromium
        working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: End-to-end tests (real API, worker and production web build)
        working-directory: apps/web
        run: pnpm e2e
