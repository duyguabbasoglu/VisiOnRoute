# CD: build → SBOM/scan → push (OIDC, no long-lived AWS keys) → register task
# definitions → migrate (must succeed) → roll out → smoke test.
# Production requires GitHub environment approval.
name: cd

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Hedef ortam"
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read
  id-token: write # AWS OIDC federation

env:
  AWS_REGION: eu-central-1
  TARGET_ENV: ${{ inputs.environment || 'staging' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Environment-scoped secrets: the web bundle embeds the environment's API origin.
    environment: ${{ inputs.environment || 'staging' }}
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    env:
      ECR_API: ${{ secrets.ECR_API_URL }}
      ECR_WEB: ${{ secrets.ECR_WEB_URL }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - name: Configure AWS credentials (OIDC deploy role)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
      - name: Build images
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          APP_HOSTNAME: ${{ secrets.APP_HOSTNAME }}
        run: |
          docker build -f infra/docker/api.Dockerfile -t "$ECR_API:$TAG" .
          docker build -f infra/docker/web.Dockerfile \
            --build-arg NEXT_PUBLIC_API_URL="https://$APP_HOSTNAME" -t "$ECR_WEB:$TAG" .
      - name: SBOM + vulnerability scan (pinned scanners)
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          for image in "$ECR_API:$TAG" "$ECR_WEB:$TAG"; do
            name=$(basename "${image%%:*}")
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              anchore/syft:v1.18.1 "$image" -o spdx-json > "sbom-$name.json"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              anchore/grype:v0.86.1 "$image" --fail-on high
          done
      - name: Push images
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker push "$ECR_API:$TAG"
          docker push "$ECR_WEB:$TAG"

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    env:
      CLUSTER: visionroute-${{ inputs.environment || 'staging' }}
      TF_DIR: infra/terraform/envs/${{ inputs.environment || 'staging' }}
      TF_VAR_image_tag: ${{ needs.build-and-push.outputs.image_tag }}
      TF_VAR_app_domain: ${{ secrets.APP_HOSTNAME }}
      TF_VAR_certificate_arn: ${{ secrets.ACM_CERTIFICATE_ARN }}
      TF_VAR_smtp_host: ${{ secrets.SMTP_HOST }}
      TF_VAR_smtp_from: ${{ secrets.SMTP_FROM }}
      TF_VAR_smtp_username: ${{ secrets.SMTP_USERNAME }}
      TF_VAR_budget_alert_email: ${{ secrets.BUDGET_ALERT_EMAIL }}
      TF_VAR_github_repository: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Configure AWS credentials (OIDC Terraform role)
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          # Separate, operator-provisioned role: Terraform manages the whole stack.
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false
      - name: Register the new API task definition (services not yet updated)
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve -target=module.stack.aws_ecs_task_definition.api
      - name: Run database migration and require success
        env:
          SUBNETS: ${{ secrets.PRIVATE_SUBNET_IDS }}
          SECURITY_GROUP: ${{ secrets.SERVICE_SG_ID }}
        run: |
          task_arn=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$CLUSTER-api" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUP]}" \
            --overrides '{"containerOverrides":[{"name":"api","command":["alembic","upgrade","head"]}]}' \
            --query 'tasks[0].taskArn' --output text)
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
          exit_code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$exit_code" != "0" ]; then
            echo "Migration başarısız (çıkış kodu: $exit_code); dağıtım durduruldu."
            exit 1
          fi
      - name: Terraform plan & apply (roll out api, worker, scheduler, web)
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan -input=false -out=tfplan
          terraform apply -input=false tfplan
      - name: Smoke test
        env:
          APP_HOSTNAME: ${{ secrets.APP_HOSTNAME }}
        run: |
          for i in $(seq 1 20); do
            if curl -fsS "https://$APP_HOSTNAME/health/ready" \
              && curl -fsS -o /dev/null "https://$APP_HOSTNAME/giris"; then
              exit 0
            fi
            sleep 15
          done
          echo "Smoke test başarısız" && exit 1
